
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>8th Wall AR Test</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #startButton {
      position: fixed;
      z-index: 10;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 15px 25px;
      font-size: 17px;
      border: 0;
      border-radius: 8px;
    }

    #status {
      position: fixed;
      z-index: 10;
      top: 20px;
      left: 0;
      width: 100%;
      color: white;
      text-align: center;
      font-size: 14px;
      pointer-events: none;
    }

    #camerafeed {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #video {
      display: none;
    }

    #cameraInfo {
      position: fixed;
      z-index: 20;
      bottom: 20px;
      left: 10px;
      color: white;
      background: rgba(0,0,0,0.7);
      padding: 10px;
      font-size: 12px;
      pointer-events: none;
     }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js"
    async
    crossorigin="anonymous"
    data-preload-chunks="slam">
  </script>

  <script type="importmap">
  {
      "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
  }
  </script>
</head>

<body>

  <button id="startButton">Start AR</button>
  <div id="status">Ready</div>
  <div id="cameraInfo"></div>

  <canvas id="camerafeed"></canvas>

  <video
    id="video"
    src="video.mp4"
    loop
    muted
    playsinline
    webkit-playsinline>
  </video>

  <script type="module">

    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

    window.THREE = THREE;

    const video = document.querySelector("#video");
    const button = document.querySelector("#startButton");
    const status = document.querySelector("#status");
    const canvas = document.querySelector("#camerafeed");
    const cameraInfo = document.querySelector("#cameraInfo");
    let cameraSettings = null;
    let cameraCapabilities = null;

    const showCameraInfo = ({
      videoWidth,
      videoHeight,
      canvasWidth,
      canvasHeight
    }) => {

      const zoom = cameraCapabilities?.zoom;

      cameraInfo.textContent =
        `Camera: ${videoWidth} x ${videoHeight} | ` +
        `Canvas: ${canvas.width} x ${canvas.height} | ` +
        `Display: ${canvas.clientWidth} x ${canvas.clientHeight} | ` +
        `Track: ${cameraSettings?.width ?? "N/A"} x ${cameraSettings?.height ?? "N/A"} | ` +
        `Facing: ${cameraSettings?.facingMode || "Unknown"} | ` +
        `Zoom range: ${zoom ? zoom.min + " - " + zoom.max : "Not supported"} | ` +
        `Current zoom: ${cameraSettings?.zoom ?? "N/A"}`;
    };

    const cameraInfoModule = {
      name: "camera-info",

      onAttach: (data) => {
        const track = data.stream?.getVideoTracks()[0];

        cameraSettings = track?.getSettings?.() || {};
        cameraCapabilities = track?.getCapabilities?.() || {};

        const isSamsung = /SM-[A-Z0-9]+/i.test(navigator.userAgent);

        if (
            isSamsung &&
            track &&
            cameraCapabilities.zoom &&
            cameraCapabilities.zoom.max >= 1.15
        ) {
            const currentConstraints = track.getConstraints();

            track.applyConstraints({
                ...currentConstraints,
                advanced: [
                    ...(currentConstraints.advanced || []),
                    { zoom: 1.15 }
                ]
            }).then(() => {
                cameraSettings = track.getSettings();
                showCameraInfo(data);
            }).catch(error => {
                cameraInfo.textContent += " | Zoom error: " + error.name + " - " + error.message;
            });
        }

        showCameraInfo(data);
    },
    };

    let videoPlane;
    let scene;

    let model = null;
    let mixer = null;
    let animationClock = new THREE.Clock();
    let modelBaseScale = new THREE.Vector3(1, 1, 1);

    const updateTarget = ({ detail }) => {

        if (!model) return;

        model.position.set(
                detail.position.x,
                detail.position.y,
                detail.position.z
        );

        model.quaternion.set(
                detail.rotation.x,
                detail.rotation.y,
                detail.rotation.z,
                detail.rotation.w
        );

        model.scale.copy(modelBaseScale).multiplyScalar(detail.scale);

        model.visible = true;

        status.textContent = "Image target detected";
    };

    const targetLost = () => {

        if (model) {
                model.visible = false;
        }

        status.textContent = "Searching for target...";
    };

    const initScenePipelineModule = () => {

        const loader = new GLTFLoader();

        return {

                name: "ar-scene",

                onStart: () => {

                        const xrScene = XR8.Threejs.xrScene();
                        scene = xrScene.scene;

                        loader.load(

                                "model.glb",

                                (gltf) => {

                                        model = gltf.scene;

                                        modelBaseScale.copy(model.scale);

                                        mixer = new THREE.AnimationMixer(model);

                                        gltf.animations.forEach((clip) => {
                                                mixer.clipAction(clip).play();
                                        });

                                        model.visible = false;

                                        scene.add(model);

                                        status.textContent = "Model loaded. Scan the target.";

                                },

                                undefined,

                                (error) => {

                                        console.error("GLB loading error:", error);
                                        status.textContent = "Model loading failed";

                                }

                        );

                },

                onUpdate: () => {

                        const delta = animationClock.getDelta();

                        if (mixer && model && model.visible) {
                                mixer.update(delta);
                        }

                },

                listeners: [

                        {
                                event: "reality.imagefound",
                                process: updateTarget
                        },

                        {
                                event: "reality.imageupdated",
                                process: updateTarget
                        },

                        {
                                event: "reality.imagelost",
                                process: targetLost
                        }

                ]

        };

    };


    const startAR = async () => {

      button.disabled = true;
      button.style.display = "none";
      status.textContent = "Loading target...";

      try {

        const response = await fetch(
          "./image-targets/imageTargetData.json"
        );

        if (!response.ok) {
          throw new Error("Could not load target JSON");
        }

        const targetData = await response.json();

        targetData.imagePath =
          "./image-targets/imageTargetData_luminance.png";

        const onXRLoaded = () => {

          const XR8 = window.XR8;

          XR8.XrController.configure({
            disableWorldTracking: true,
            imageTargetData: [targetData]
          });

          XR8.addCameraPipelineModules([

            XR8.GlTextureRenderer.pipelineModule(),
            XR8.Threejs.pipelineModule(),
            XR8.XrController.pipelineModule(),
            XRExtras.FullWindowCanvas.pipelineModule(),
            cameraInfoModule,

            initScenePipelineModule()

          ]);

          XR8.run({
            canvas: canvas,
            allowedDevices: XR8.XrConfig.device().ANY
          });

          status.textContent = "Point camera at your card";

        };

        if (window.XR8) {
          onXRLoaded();
        } else {
          window.addEventListener("xrloaded", onXRLoaded, {
            once: true
          });
        }

      } catch (error) {

        console.error(error);
        status.textContent = "Error: " + error.message;
        button.disabled = false;

      }

    };

    button.addEventListener("click", startAR);

  </script>

</body>
</html>
